<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff">
<title>ตัวอย่างหน้าแล็บ การแพร่ของสาร · การทดลองเสมือน</title>
<style>
/* pagekit kit.css */
:root{--acc:#0f766e;--accd:#0b5a54;--acc2:#e2efee;--acc3:#61a59f;--soft:#f1f7f6;--line:#d4e6e5;--line2:#bcd9d6;--line3:#b2d3d1;}
/* pagekit kit.css : ธีมกลางของหน้าแล็บ (ก่อน inject) สีมาจาก :root ที่ build_page.py สร้างจาก PAGE.accent
 * ไม่ซ้ำกับ tools/apple_theme.css: ที่นี่ไม่กำหนดรูปทรงปุ่ม (padding/radius/shadow), น้ำหนักหัวข้อ, ring โฟกัส, ขนาด body
 * (apple_theme.css ถูกฝังท้าย <head> ภายหลังและทับให้) ที่นี่กำหนดเฉพาะสี เลย์เอาต์ และคอมโพเนนต์ของหน้า
 * ตัวแปรที่ build_page.py ใส่ให้: --acc --accd --acc2 --acc3 --soft --line --line2 --line3 */
:root{color-scheme:light;--ink:#172033;--muted:#5d6b82;--ok:#157a55;--bad:#b63f43;--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Thonburi","Sarabun",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font:16px/1.7 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit}button{cursor:pointer}
label{min-width:0}select,input[type=number]{width:100%;max-width:100%}
.wrap{width:min(1120px,calc(100% - 36px));margin:auto}@media(max-width:570px){.wrap{width:calc(100% - 24px)}}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.top{display:flex;justify-content:space-between;align-items:center;height:78px;gap:12px}@media(max-width:570px){.top{height:65px}}
.top a.brand{display:flex;align-items:center;gap:10px;color:var(--ink);font-weight:700}
.mark{display:grid;place-items:center;width:36px;height:36px;border-radius:12px;background:linear-gradient(145deg,var(--acc3),var(--acc));color:#fff;font-size:1.05rem}
.top a{color:var(--accd);text-decoration:none;font-weight:600}
.hero{padding:clamp(22px,4vw,38px) clamp(23px,5vw,58px);border:1px solid var(--line);border-radius:30px;background:linear-gradient(130deg,#fff,var(--acc2));box-shadow:0 28px 65px rgba(11,40,50,.07);margin-bottom:6px}
@media(max-width:570px){.hero{border-radius:23px;padding:26px 22px}}
.eyebrow{color:var(--accd);font-size:.75rem;font-weight:760}
h1{margin:.2rem 0 .5rem;font-size:clamp(2rem,5vw,3.2rem);letter-spacing:-.03em;line-height:1.15}
.hero p{color:var(--muted);max-width:760px;margin:.3rem 0}
.progress{display:flex;align-items:center;gap:12px;margin:14px 0;flex-wrap:wrap;color:var(--muted);font-size:.85rem}
.track{flex:none;width:180px;height:7px;border-radius:99px;background:var(--acc2);overflow:hidden}
.track i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc3),var(--acc));transition:width .4s}
.notice{border:1px solid var(--line2);background:var(--soft);border-radius:16px;padding:12px 16px;font-size:.92rem;color:var(--ink);margin:12px 0}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:6px 6px 10px;margin:0 -6px;scrollbar-width:thin}
.tab{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;font-weight:600;color:var(--ink);min-height:44px}
.tab[aria-selected=true]{background:var(--acc);border-color:var(--acc);color:#fff}
.tab .ck{margin-left:6px;color:var(--ok)}.tab[aria-selected=true] .ck{color:#fff}
.panel{border:1px solid var(--line);border-radius:25px;padding:clamp(16px,3vw,30px);background:#fff;box-shadow:0 18px 48px rgba(11,40,50,.07),0 3px 10px rgba(11,40,50,.03);margin-bottom:24px}
.panel h2{margin:0 0 .3rem;font-size:1.5rem;line-height:1.3}
.sub{color:var(--muted);margin:.2rem 0 1rem}
.box{border:1px solid var(--line);border-radius:18px;padding:16px;background:linear-gradient(145deg,#fff,var(--soft));margin:14px 0}
.box h3{margin:.1rem 0 .5rem;font-size:1.05rem}
.box ol,.box ul{margin:.3rem 0;padding-left:1.3rem}.box li{margin:.15rem 0}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:760px){.cols{grid-template-columns:1fr}}
.lab{border:1px solid var(--line3);border-radius:22px;padding:16px;background:linear-gradient(160deg,var(--acc2),#fff);margin:16px 0}
.lab>h3{margin:0 0 .2rem}
.btn{border:0;padding:10px 18px;background:var(--acc);color:#fff}
.btn.alt{background:#fff;color:var(--accd);border:1.5px solid var(--acc)}
.btn.sm{padding:6px 14px;font-size:.92rem}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;align-items:center}
.chip{border:1.5px solid var(--line3);background:#fff;border-radius:999px;padding:7px 14px;min-height:44px;font-weight:600}
.chip[aria-pressed=true]{background:var(--acc);color:#fff;border-color:var(--acc)}
table{width:100%;border-collapse:collapse;font-size:.93rem;background:#fff;border-radius:12px;overflow:hidden}
th,td{border:1px solid var(--line);padding:6px 9px;text-align:center}th{background:var(--acc2);font-weight:650}
td.l,th.l{text-align:left}
/* ตาราง: .tw คือกรอบเลื่อนแนวนอน ไม่บังคับความกว้างขั้นต่ำ (ตาราง 2 คอลัมน์จึงไม่โดนตัดครึ่ง) ใส่ class wide เฉพาะตาราง >= 3 คอลัมน์ที่ต้องการกันไม่ให้ถูกบีบ
   kit.js ถอด wide ออกจากตาราง <= 2 คอลัมน์ ตั้ง min-width = คอลัมน์ x 92px และใส่คำใบ้ "เลื่อนดูต่อ" เมื่อกรอบแคบกว่าตาราง */
.tw{overflow-x:auto;max-width:100%}
.tw table.wide{min-width:0}   /* ความกว้างขั้นต่ำของ wide ตั้งโดย kit.js ตามจำนวนคอลัมน์ (tidyTables) */
.tw-hint{font-size:.8rem;color:var(--muted);margin:2px 0 4px}
.read{display:inline-block;padding:3px 12px;border-radius:8px;background:#1b2a30;color:#9ff0c0;font:700 1.1rem ui-monospace,Menlo,monospace}
.small{font-size:.86rem;color:var(--muted)}
/* รูป/SVG: ไม่กว้างเกิน 560 px และอยู่กึ่งกลาง ฟอนต์ใน SVG ต้องไม่เล็กกว่า 11 px ที่หน้าจอ 375 px (ดู K.svg) */
.fig{border:1px solid var(--line);border-radius:16px;background:#fff;padding:8px}
svg{max-width:100%}
.fig svg{display:block;width:100%;height:auto;max-width:560px;margin:0 auto}
.q{margin:14px 0;padding:14px;border:1px solid var(--line);border-radius:16px;background:#fff}
.q p{margin:0 0 .4rem;font-weight:600}
fieldset.exf{margin:8px 0;min-width:0}fieldset.exf legend{font-weight:600;padding:0 6px}
.opt{display:flex;gap:8px;align-items:flex-start;padding:7px 10px;border-radius:12px;border:1px solid transparent;min-height:44px}
.opt:hover{background:var(--soft)}.opt input{margin-top:.45rem}
.why{font-size:.9rem;color:var(--ink);margin-top:6px;padding:8px 10px;border-radius:10px;background:var(--soft)}
.res{font-weight:700;margin-top:8px}.res.ok{color:var(--ok)}.res.bad{color:var(--bad)}
textarea{width:100%;min-height:84px;border:1px solid #c9cfe0;border-radius:14px;padding:9px 12px;resize:vertical}
.tip{font-size:.9rem;color:var(--ink);background:var(--acc2);border-radius:12px;padding:8px 12px;margin:8px 0}
.warn{border:1px solid #e3b4b4;background:#fdf1f1;border-radius:14px;padding:10px 14px;color:#7a2a2d;font-size:.92rem;margin:10px 0}
.hide{display:none!important}
.lbl{display:block;font-weight:600;margin:.6rem 0 .2rem}
.eq{font-family:ui-serif,Georgia,serif;font-size:1.02rem}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:.92rem}
.rowflex{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.rowflex>label{flex:1 1 180px;font-weight:600;font-size:.92rem}
.footer{color:var(--muted);font-size:.86rem;padding:10px 0 30px}.footer a{color:var(--accd)}
.btn:focus-visible,.tab:focus-visible,.chip:focus-visible{border-radius:999px}
sub{font-size:.75em;line-height:0}sup{font-size:.75em;line-height:0}
.mk{margin-left:8px}.mk.okc{color:var(--ok)}.mk.badc{color:var(--bad)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:8px 0}.kv b{font-weight:650}
.tbl-sm td,.tbl-sm th{font-size:.88rem}.mini th,.mini td{padding:4px 7px;font-size:.88rem}
.sel2{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:560px){.sel2{grid-template-columns:1fr}}
.ok-t{color:var(--ok);font-weight:650}.bad-t{color:var(--bad);font-weight:650}
.ledrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:8px 0}
.ledrow label{font-weight:600;font-size:.92rem;display:block}
.ledrow input[type=range]{width:100%;min-height:44px}
.ledrow input[type=text],.ledrow textarea,.ledrow select{display:block;width:100%;max-width:100%}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:8px 0}
.stat div{border:1px solid var(--line);border-radius:14px;padding:8px 12px;background:#fff}.stat b{display:block;font-size:1.15rem}
.ok-bg{background:#e8f6ef}.bad-bg{background:#fdf1f1}
.stepno{display:inline-block;min-width:1.6em;text-align:center;background:var(--acc);color:#fff;border-radius:999px;padding:0 .5em;margin-right:6px;font-size:.85rem}
.pbar{height:8px;border-radius:99px;background:var(--acc2);overflow:hidden;margin:6px 0}.pbar i{display:block;height:100%;background:var(--acc);width:0;transition:width .3s}
.cite{font-family:ui-serif,Georgia,serif;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;word-break:break-word;overflow-wrap:anywhere}
.timer{font:700 2rem ui-monospace,Menlo,monospace}.timer.over{color:var(--bad)}
.rg{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.rg label{display:flex;gap:6px;align-items:center;min-height:44px;padding:4px 12px;border:1.5px solid var(--line3);border-radius:999px;background:#fff;font-weight:600}
.rg label:has(input:checked){background:var(--acc);color:#fff;border-color:var(--acc)}
.rl{display:flex;gap:10px;flex-wrap:wrap}.rl label{display:flex;gap:4px;align-items:center;min-height:44px}
.num{width:7.5em;min-height:44px;border:1px solid var(--line3);border-radius:12px;padding:6px 10px;text-align:right}
.hl{background:var(--acc2);border-radius:6px;padding:0 4px}
.nw{white-space:nowrap}
.bar2{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:.9rem}.bar2 .lb{flex:0 0 9.5em}
.bar2 .tr{flex:1;height:16px;border-radius:99px;background:var(--acc2);overflow:hidden}.bar2 .tr i{display:block;height:100%;background:var(--acc)}
.bar2 .vv{flex:0 0 4.5em;text-align:right;font-variant-numeric:tabular-nums}@media(max-width:480px){.bar2 .lb{flex-basis:7em}}
input[type=range],input[type=checkbox],input[type=radio]{accent-color:var(--acc)}
svg text{font-family:var(--font)}
/* แอนิเมชันสำเร็จรูปสำหรับห้องทดลอง (ปิดอัตโนมัติเมื่อผู้ใช้ตั้ง reduced-motion) */
.tube{transition:fill .5s,height .5s,y .5s,opacity .5s}
.flow{stroke-dasharray:6 6;animation:fl 1s linear infinite}.flow.rev{animation-direction:reverse}
@keyframes fl{to{stroke-dashoffset:-12}}
.bub{animation:bub 1.2s ease-in infinite}
@keyframes bub{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-22px);opacity:0}}
/* อ่านก่อนทดลอง */
.rd{margin:0 0 6px}
.rd-head{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;margin-bottom:6px}
.rd-tag{display:inline-block;background:var(--acc2);color:var(--accd);border:1px solid var(--acc3);border-radius:999px;padding:3px 12px;font-size:.82rem;font-weight:650}
.rd-lead{flex:1 1 280px;margin:0;color:var(--muted)}
.rd-sec{border:1px solid var(--line);border-radius:18px;padding:clamp(14px,2.4vw,22px);background:#fff;margin:14px 0}
.rd-sec h2{margin:.1rem 0 .15rem;font-size:1.2rem}
.rd-pg{font-size:.82rem;color:var(--muted);margin:0 0 .7rem}
.rd-sec p{margin:.5rem 0}.rd-sec ul,.rd-sec ol{padding-left:1.35rem;margin:.4rem 0}.rd-sec li{margin:.22rem 0}
.rd-q{margin:.8rem 0 .1rem;border:1px dashed var(--acc3);border-radius:14px;padding:8px 14px;background:var(--soft)}
.rd-q summary{cursor:pointer;font-weight:600;color:var(--accd)}.rd-q p{margin:.4rem 0 .2rem}
.rd-div{display:flex;align-items:center;gap:12px;margin:22px 0 10px;color:var(--accd);font-weight:700}
.rd-div::before,.rd-div::after{content:"";flex:1;height:1px;background:var(--acc3)}
.rd-skip{margin:6px 0 0}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="kit-root"></div>
<noscript><p style="padding:16px">หน้านี้ต้องเปิด JavaScript เพื่อแสดงกิจกรรม</p></noscript>
<script>
/* pagekit kit.js */
/* pagekit kit.js : เครื่องยนต์กลางของหน้าแล็บ (plain browser JS ไม่มี module/ไลบรารีภายนอก)
 * ใช้คู่กับ kit.css ประกอบเป็นไฟล์เดียวด้วย tools/pagekit/build_page.py
 *
 * ผู้เขียนหน้าเขียนเฉพาะ content.js (กำหนด PAGE) และ labs.js (K.lab(id, build, wire)) ดู AGENT_BRIEF.md
 *
 * พฤติกรรมที่ผ่าน QA มาแล้วและต้องคงไว้ (ห้ามแก้เพื่อความสะดวก):
 *  Q1  แบบทดสอบไม่ไฮไลต์ตัวเลือก (ไม่ใส่ class ถูก/ผิดที่ตัวเลือก) แสดงเฉพาะคะแนน + เฉลย + คำอธิบายใต้ข้อ
 *  Q2  ตำแหน่งเฉลยกำหนดชัดเจน: รับ perm ต่อชุด ไม่งั้นสุ่มแบบกำหนดผลได้ (seed = id หน้า+id ชุด) ไม่เวียนเป็นวงจร
 *      ไม่จับกลุ่ม ไม่เป็นคาบ ตรวจซ้ำก่อนใช้ ชุด 2 ตัวเลือกใช้ตรรกะเดียวกัน (แค่สลับ 2 ช่อง) ข้อที่ keep:true ไม่ถูกย้าย
 *  Q3  CLEAN[]: ทุกแอนิเมชัน/ตัวจับเวลาของแท็บต้องลงทะเบียน K.clean(fn) (หรือใช้ K.anim) เพื่อหยุดก่อนเปลี่ยนแท็บ
 *  Q4  LabScore.use(id,title) เรียก "หลัง" สร้างแผงเสร็จ ไม่งั้นตัวนับของแผงส่งผลที่ inject ไว้จะค้างค่าแท็บก่อนหน้า
 *  Q5  ตาราง .tw ไม่บังคับ min-width กับตาราง <= 2 คอลัมน์ (ไม่โดนตัดครึ่ง) และมีคำใบ้ "เลื่อนดูต่อ" เมื่อกรอบแคบกว่าตาราง
 *  Q6  .fig svg กว้างไม่เกิน 560px อยู่กึ่งกลาง; K.svg บังคับ role=img + aria-label; K.fitSvg ดันฟอนต์ให้ >= 11px ที่หน้าจอจริง (375px)
 *  Q7  ปุ่มรีเซ็ตบอกว่าคะแนนที่บันทึกไปแล้วไม่ถูกล้าง (LabScore.set ค่าล่าสุดยังอยู่)
 *  Q8  hero แสดงเฉพาะฟีเจอร์ที่มีจริง (ประโยคสร้างจาก PAGE) + หมายเหตุข้อเขียน (ส่งเฉพาะแท็บที่เปิดอยู่ตอนกดส่ง)
 *  Q9  ข้อเขียนเป็น <textarea id label[for]> เสมอ (โมดูลส่งคะแนนเก็บ textarea ทั้งหน้าด้วย label[for]); ส่งออก/คัดลอกใช้ <pre> สำรอง ไม่ใช้ textarea
 *  Q10 localStorage ทุกจุดอยู่ใน try/catch; หน้าต้องใช้ได้เมื่อ storage ใช้ไม่ได้
 *  Q11 reduced-motion: ห้องทดลองต้องกระโดดไปผลสุดท้ายเอง (K.REDUCE / K.reduced()); CSS ปิด animation/transition
 *  Q12 ทิศทางลูกศร/Home/End บนแท็บ (roving tabindex) และลิงก์ตรง #act-<id>
 */
(function () {
  'use strict';
  const K = window.K = { version: 1 };
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const fmt = (x, d) => { const v = Number(x); return Number.isFinite(v) ? String(+v.toFixed(d == null ? 2 : d)) : '–'; };
  const REDUCE = (() => { try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (_) { return false; } })();
  const reduced = () => { try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (_) { return false; } };
  Object.assign(K, { $, $$, esc, fmt, REDUCE, reduced });

  let P = null;                 /* PAGE */
  let st = { done: {}, q: {}, run: {} };
  let DR = {};
  let KEY = '', DK = '';
  const BUILD = {};             /* id -> [build, wire] */
  const CLEAN = [];
  let cur = 0, TABS = [], usedFields = false;
  const QS = {}, NUMS = {}, GRIDS = {};   /* ชุดที่ประมวลผลแล้ว */
  const qid = a => String(a).replace(/[^A-Za-z0-9_-]/g, '_');

  /* ---------- storage (Q10) ---------- */
  function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (_) { } }
  function dsave() { try { localStorage.setItem(DK, JSON.stringify(DR)); } catch (_) { } }
  function loadState() {
    try { const s = JSON.parse(localStorage.getItem(KEY) || '{}'); if (s && s.done) st = Object.assign({ done: {}, q: {}, run: {} }, s); } catch (_) { }
    try { DR = JSON.parse(localStorage.getItem(DK) || '{}') || {}; } catch (_) { DR = {}; }
  }
  const dget = (ns, k) => { const v = DR[ns + '|' + k]; return v == null ? '' : v; };
  const dset = (ns, k, v) => { DR[ns + '|' + k] = v; dsave(); };
  const PARTS = {};
  function ls(name, got, max) {
    /* LabScore รับชื่อส่วน <= 40 ตัวอักษร, เต็ม <= 100, รวมไม่เกิน 20 ส่วน: เตือนใน console ถ้าละเมิด */
    try { PARTS[name] = max; if ([...String(name)].length > 40 || max > 100 || Object.keys(PARTS).length > 20) console.warn('pagekit: ส่วนคะแนนผิดข้อจำกัด', name, max); } catch (_) { }
    try { window.LabScore && window.LabScore.set(name, got, max); } catch (_) { }
  }
  Object.assign(K, { dget, dset, ls, save, qid });
  K.state = () => st;
  K.clean = fn => { CLEAN.push(fn); };
  K.lab = (id, build, wire) => { BUILD[id] = [build || (() => ''), wire || (() => { })]; };

  /* ---------- ตำแหน่งเฉลย (Q2) ---------- */
  function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

<script>
/* labs.js */
(function(){'use strict';const {$,$$,esc,fmt,REDUCE,reduced,dget,dset,ls,qid,state,clean,lab,run,anim,svg,fitSvg,wireDraft,wireRadio,radioGroup,fieldsHTML,textOf,revealHTML,expHTML,wireExp,quizHTML,wireQuiz,numHTML,wireNum,markDone,setLabel,select}=K;
/* ตัวอย่าง labs.js: ห้องทดลองเสมือนแบบกำหนดเอง 1 แท็บ (SVG + แอนิเมชัน)
 * ตัวแปร $, $$, esc, fmt, REDUCE, dget, ls, clean, lab, run, anim, svg ... มีให้แล้ว (ดูรายการใน AGENT_BRIEF.md) ห้ามประกาศซ้ำ
 * ชั้นนอกของไฟล์นี้ห้ามแตะ DOM: ทำงานใน build() / wire() เท่านั้น */
const W = 280, H = 150, N = 24;
const SEEDS = Array.from({ length: N }, (_, i) => ({ a: (i * 137.5) % 360, r: 4 + (i % 5) }));  /* ค่าคงที่ ไม่ใช้ Math.random เพื่อให้ผลซ้ำได้ */
const speedOf = t => 0.4 + (t - 10) * 0.02;     /* สมมติเอง: ความเร็วสัมพันธ์เพิ่มตามอุณหภูมิ (ไม่ใช่สูตรจริง) */

lab('e1', () => `
  <div class="box"><h3>จุดประสงค์ (สมมติ)</h3><p>สังเกตว่าอุณหภูมิเปลี่ยนความเร็วของการแพร่อย่างไร</p></div>
  <div class="lab"><h3>ห้องทดลองเสมือน: หยดสีในน้ำ</h3>
  <p class="small"><b>แบบจำลองเพื่อการศึกษา:</b> ความเร็วเป็นค่าสมมติของผู้จัดทำหน้า ไม่ใช่ข้อมูลวัดจริง</p>
  <div class="ledrow"><label for="tmp">อุณหภูมิน้ำ: <b id="tv">20</b> °C<input id="tmp" type="range" min="10" max="60" step="5" value="20"></label></div>
  <div class="fig">${svg(W, H, 'แก้วน้ำที่มีอนุภาคสีกระจาย', `<rect x="20" y="10" width="240" height="130" rx="10" fill="#e8f4f8" stroke="#24413f" stroke-width="2"/><g id="dots"></g><text x="140" y="146" text-anchor="middle" font-size="12" fill="#24413f">เวลา <tspan id="clk">0</tspan> วินาที</text>`, { id: 'svgE1' })}</div>
  <div class="btns"><button class="btn" type="button" id="go">เริ่มแพร่</button><button class="btn alt" type="button" id="rs">ตั้งต้นใหม่</button></div>
  <div class="tip" id="msg" aria-live="polite">กดเริ่มเพื่อดูการกระจายของสี</div></div>`,
(root) => {
  let t = 0, spread = 0;
  const dots = $('#dots'), tmp = $('#tmp');
  const draw = () => {
    $('#tv').textContent = tmp.value;
    dots.innerHTML = SEEDS.map(s => { const rr = 6 + spread * (40 + s.r * 6), x = 140 + Math.cos(s.a) * rr * 2, y = 75 + Math.sin(s.a) * rr * .8;
      return `<circle cx="${Math.max(30, Math.min(250, x)).toFixed(1)}" cy="${Math.max(20, Math.min(125, y)).toFixed(1)}" r="4" fill="#b63f43" opacity=".8"/>`; }).join('');
    $('#clk').textContent = Math.round(t);
    K.setLabel($('#svgE1'), 'แก้วน้ำที่อุณหภูมิ ' + tmp.value + ' องศา อนุภาคสีกระจาย ' + Math.round(spread * 100) + ' เปอร์เซ็นต์ ที่เวลา ' + Math.round(t) + ' วินาที');
  };
  const loop = anim(dt => { t += dt * 10; spread = Math.min(1, spread + dt * speedOf(+tmp.value) * 0.5); draw(); if (spread >= 1) { done(); return false; } }, { el: root });
  function done() { $('#msg').textContent = 'กระจายทั่วแก้วแล้วที่เวลา ' + Math.round(t) + ' วินาที (เวลาในแบบจำลอง) ลองเปลี่ยนอุณหภูมิแล้วเทียบดู'; run('e1'); }
  $('#go').onclick = () => { t = 0; spread = 0; if (REDUCE) { spread = 1; t = Math.round(10 / speedOf(+tmp.value)); draw(); done(); } else { $('#msg').textContent = 'กำลังแพร่…'; loop.start(); } };
  $('#rs').onclick = () => { loop.stop(); t = 0; spread = 0; draw(); $('#msg').textContent = 'กดเริ่มเพื่อดูการกระจายของสี'; };
  tmp.oninput = () => { if (!loop.running) draw(); };
  draw();
});

})();
</script>
